<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Library</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a0f2e 100%);
      color: #fff;
      font-size: 12px;
      height: 100vh;
      overflow: hidden;
    }
    
    .container {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    
    .header {
      background: linear-gradient(135deg, #1a0f2e 0%, #2d1b4e 100%);
      padding: 16px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    
    .header h1 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #4fc3f7, #29b6f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .search-bar {
      display: flex;
      gap: 8px;
    }
    
    .search-bar input, .search-bar select {
      flex: 1;
      padding: 8px 12px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      color: #fff;
      font-size: 12px;
      border-radius: 6px;
      backdrop-filter: blur(10px);
      transition: all 0.3s;
    }
    
    .search-bar input:focus, .search-bar select:focus {
      outline: none;
      background: rgba(255,255,255,0.12);
      border-color: #4fc3f7;
      box-shadow: 0 0 12px rgba(79, 195, 247, 0.3);
    }
    
    .search-bar input::placeholder {
      color: rgba(255,255,255,0.4);
    }
    
    .content {
      display: flex;
      flex: 1;
      gap: 0;
      min-height: 0;
    }
    
    .video-grid {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      background: transparent;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    
    .video-card {
      background: linear-gradient(135deg, rgba(45, 27, 78, 0.6), rgba(79, 195, 247, 0.1));
      padding: 8px 10px;
      border: 1px solid rgba(79, 195, 247, 0.2);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .video-card:hover {
      background: linear-gradient(135deg, rgba(79, 195, 247, 0.15), rgba(41, 182, 246, 0.2));
      border-color: #4fc3f7;
    }
    
    .video-card.queued {
      border-left: 3px solid #29b6f6;
      background: linear-gradient(135deg, rgba(41, 182, 246, 0.15), rgba(79, 195, 247, 0.1));
    }
    
    .video-thumb {
      width: 60px;
      height: 34px;
      background: #000;
      border-radius: 4px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      overflow: hidden;
    }
    
    .video-thumb img, .video-thumb video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .video-info {
      flex: 1;
      min-width: 0;
    }
    
    .video-title {
      font-weight: 600;
      font-size: 12px;
      margin-bottom: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    
    .video-meta {
      font-size: 9px;
      color: rgba(255,255,255,0.5);
    }
    
    .video-btns {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }
    
    .video-btns button {
      padding: 5px 8px;
      font-size: 10px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      background: rgba(79, 195, 247, 0.2);
      color: #fff;
      transition: all 0.2s;
      white-space: nowrap;
    }
    
    .video-btns button:hover {
      background: rgba(79, 195, 247, 0.4);
    }
    
    .video-btns button.delete:hover {
      background: rgba(244, 67, 54, 0.4);
    }
    
    .right-panel {
      width: 300px;
      background: linear-gradient(135deg, rgba(10, 10, 10, 0.6), rgba(45, 27, 78, 0.3));
      border-left: 1px solid rgba(79, 195, 247, 0.1);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      backdrop-filter: blur(10px);
    }
    
    .panel-section {
      border-bottom: 1px solid rgba(79, 195, 247, 0.1);
      padding: 14px;
    }
    
    .panel-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      background: linear-gradient(135deg, #4fc3f7, #29b6f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }
    
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 10px;
    }
    
    .form-group input {
      padding: 8px 10px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(79, 195, 247, 0.2);
      color: #fff;
      font-size: 11px;
      border-radius: 5px;
      transition: all 0.3s;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    
    .form-group input:focus {
      outline: none;
      background: rgba(255,255,255,0.1);
      border-color: #4fc3f7;
      box-shadow: 0 0 8px rgba(79, 195, 247, 0.2);
    }
    
    .form-group input::placeholder {
      color: rgba(255,255,255,0.3);
    }
    
    .btn {
      padding: 8px 12px;
      background: linear-gradient(135deg, #4fc3f7, #29b6f6);
      color: white;
      border: none;
      cursor: pointer;
      font-size: 11px;
      border-radius: 5px;
      font-weight: 600;
      transition: all 0.3s;
    }
    
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(79, 195, 247, 0.3);
    }
    
    .btn.full {
      width: 100%;
    }
    
    .btn-danger {
      background: linear-gradient(135deg, #f44336, #e91e63);
    }
    
    .btn-danger:hover {
      box-shadow: 0 6px 20px rgba(244, 67, 54, 0.3);
    }
    
    .btn-success {
      background: linear-gradient(135deg, #26c6da, #00bcd4);
    }
    
    .btn-success:hover {
      box-shadow: 0 6px 20px rgba(38, 198, 218, 0.3);
    }
    
    .file-drop {
      border: 2px dashed rgba(79, 195, 247, 0.3);
      border-radius: 6px;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
      margin-bottom: 10px;
      background: rgba(79, 195, 247, 0.05);
    }
    
    .file-drop:hover {
      border-color: #4fc3f7;
      background: rgba(79, 195, 247, 0.12);
    }
    
    .file-drop input {
      display: none;
    }
    
    .file-drop-text {
      font-size: 11px;
      color: rgba(255,255,255,0.6);
    }
    
    .queue-item {
      background: rgba(79, 195, 247, 0.08);
      padding: 6px 8px;
      margin-bottom: 4px;
      border-left: 2px solid #4fc3f7;
      border-radius: 4px;
      font-size: 10px;
      display: flex;
      gap: 6px;
      align-items: center;
    }
    
    .queue-item span {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    
    .queue-item button {
      padding: 2px 4px;
      font-size: 8px;
      background: rgba(244, 67, 54, 0.3);
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 2px;
    }
    
    .preset-btn {
      width: 100%;
      padding: 6px;
      margin-bottom: 4px;
      text-align: left;
      font-size: 10px;
      background: rgba(79, 195, 247, 0.1);
      color: #fff;
      border: 1px solid rgba(79, 195, 247, 0.2);
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .preset-btn:hover {
      background: rgba(79, 195, 247, 0.2);
    }
    
    .btn-group {
      display: flex;
      gap: 6px;
    }
    
    .btn-group button {
      flex: 1;
    }

    .empty {
      text-align: center;
      padding: 30px 20px;
      color: rgba(255,255,255,0.3);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🎬 Video Library</h1>
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="検索...">
        <select id="sceneFilter">
          <option value="all">すべて</option>
        </select>
      </div>
    </div>
    
    <div class="content">
      <div class="video-grid" id="videoGrid">
        <div class="empty">動画を追加してください</div>
      </div>
      
      <div class="right-panel">
        <!-- ストレージ設定 -->
        <div class="panel-section">
          <div class="panel-title">⚙️ ストレージ設定</div>
          <div class="form-group">
            <input type="text" id="r2BaseUrl" placeholder="R2ベースURL (https://pub-xxx.r2.dev)">
          </div>
          <button class="btn full" id="saveR2Btn">保存</button>
        </div>

        <!-- 動画追加 -->
        <div class="panel-section">
          <div class="panel-title">➕ 動画追加</div>
          
          <div class="form-group">
            <input type="text" id="videoTitle" placeholder="タイトル">
          </div>
          <div class="form-group">
            <input type="text" id="videoUrl" placeholder="ファイル名 (例: PV2.mp4) または フルURL">
          </div>
          <div class="form-group">
            <input type="text" id="videoScene" placeholder="シーン名">
          </div>
          <button class="btn full" id="addVideoBtn">追加</button>
        </div>
        
        <!-- キュー（非表示） -->
        <div class="panel-section" style="display: none;">
          <div class="panel-title">📋 キュー</div>
          <div id="queueList" style="margin-bottom: 10px; max-height: 120px; overflow-y: auto;">
            <div style="color: rgba(255,255,255,0.3); font-size: 10px;">空</div>
          </div>
          <div class="btn-group">
            <button class="btn btn-success" id="playQueueBtn">▶ 再生</button>
            <button class="btn btn-danger" id="clearQueueBtn">クリア</button>
          </div>
        </div>
        
        <!-- プリセット -->
        <div class="panel-section">
          <div class="panel-title">⭐ プリセット</div>
          <div class="form-group" style="margin-bottom: 8px;">
            <input type="text" id="presetName" placeholder="プリセット名">
            <button class="btn full" id="savePresetBtn">保存</button>
          </div>
          <div id="presetList" style="max-height: 120px; overflow-y: auto;">
            <div style="color: rgba(255,255,255,0.3); font-size: 10px;">なし</div>
          </div>
        </div>

        <!-- データ管理 -->
        <div class="panel-section">
          <div class="panel-title">💾 データ管理</div>
          <button class="btn full" id="exportBtn" style="margin-bottom: 6px;">⬇️ エクスポート</button>
          <button class="btn full" id="importBtn" style="background: linear-gradient(135deg, #9c27b0, #673ab7);">⬆️ インポート</button>
          <input type="file" id="importFile" accept=".json" style="display: none;">
        </div>
      </div>
    </div>
  </div>

  <script>
    let videos = [];
    let queue = [];
    let presets = {};
    let scenes = new Set(['all']);
    let r2BaseUrl = '';
    const STORAGE_KEY = 'videoLib';
    const R2_KEY = 'videoLib_r2base';

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ videos, queue, presets }));
    }

    function load() {
      const data = localStorage.getItem(STORAGE_KEY);
      if (data) {
        const parsed = JSON.parse(data);
        videos = parsed.videos || [];
        queue = parsed.queue || [];
        presets = parsed.presets || {};
        videos.forEach(v => scenes.add(v.scene));
      }
      r2BaseUrl = localStorage.getItem(R2_KEY) || '';
      document.getElementById('r2BaseUrl').value = r2BaseUrl;
    }

    function render() {
      const filter = document.getElementById('sceneFilter').value;
      const search = document.getElementById('searchInput').value.toLowerCase();
      
      let filtered = videos;
      if (filter !== 'all') filtered = filtered.filter(v => v.scene === filter);
      if (search) filtered = filtered.filter(v => v.title.toLowerCase().includes(search));

      const grid = document.getElementById('videoGrid');
      if (filtered.length === 0) {
        grid.innerHTML = '<div class="empty">動画なし</div>';
        return;
      }

      grid.innerHTML = filtered.map(v => `
        <div class="video-card ${queue.includes(v.id) ? 'queued' : ''}">
          <div class="video-thumb">🎬</div>
          <div class="video-info">
            <div class="video-title">${v.title}</div>
            <div class="video-meta">${v.scene}</div>
          </div>
          <div class="video-btns">
            <button onclick="play('${v.id}')">▶ 再生</button>
            <button class="delete" onclick="del('${v.id}')">✕</button>
          </div>
        </div>
      `).join('');
    }

    function renderQueue() {
      const list = document.getElementById('queueList');
      if (queue.length === 0) {
        list.innerHTML = '<div style="color: rgba(255,255,255,0.3); font-size: 10px;">空</div>';
        return;
      }
      list.innerHTML = queue.map((id, i) => {
        const v = videos.find(x => x.id === id);
        return `
          <div class="queue-item">
            <span>${i + 1}. ${v?.title || '?'}</span>
            <button onclick="removeQueue('${id}')">✕</button>
          </div>
        `;
      }).join('');
    }

    function renderPresets() {
      const list = document.getElementById('presetList');
      const names = Object.keys(presets);
      if (names.length === 0) {
        list.innerHTML = '<div style="color: rgba(255,255,255,0.3); font-size: 10px;">なし</div>';
        return;
      }
      list.innerHTML = names.map(name => `
        <div style="display: flex; gap: 4px; margin-bottom: 4px;">
          <button class="preset-btn" style="flex: 1;" onclick="loadPreset('${name}')">${name}</button>
          <button class="preset-btn btn-danger" style="width: 30px; padding: 6px 4px;" onclick="delPreset('${name}')">✕</button>
        </div>
      `).join('');
    }

    function play(id) {
      const v = videos.find(x => x.id === id);
      if (v) {
        localStorage.setItem('videoLib_play', JSON.stringify({ id, url: v.url, title: v.title }));
        window.dispatchEvent(new StorageEvent('storage', { key: 'videoLib_play' }));
      }
    }

    function addQueue(id) {
      if (!queue.includes(id)) queue.push(id);
      save();
      renderQueue();
      render();
    }

    function removeQueue(id) {
      queue = queue.filter(x => x !== id);
      save();
      renderQueue();
      render();
    }

    function del(id) {
      if (!confirm('削除？')) return;
      videos = videos.filter(x => x.id !== id);
      queue = queue.filter(x => x !== id);
      save();
      render();
      renderQueue();
    }

    function convertGoogleDriveUrl(url) {
      const match = url.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/);
      if (match && match[1]) {
        return `https://drive.google.com/uc?export=download&id=${match[1]}`;
      }
      return url;
    }

    function addVideo() {
      const title = document.getElementById('videoTitle').value.trim();
      let url = document.getElementById('videoUrl').value.trim();
      const scene = document.getElementById('videoScene').value.trim() || 'その他';

      if (!title || !url) {
        alert('タイトルとURLを入力してください');
        return;
      }

      // http/https で始まらない場合、R2ベースURLと結合
      if (!/^https?:\/\//.test(url)) {
        if (!r2BaseUrl) {
          alert('先にR2ベースURLを設定するか、フルURLを入力してください');
          return;
        }
        const base = r2BaseUrl.replace(/\/$/, '');
        url = `${base}/${url.replace(/^\//, '')}`;
      } else {
        url = convertGoogleDriveUrl(url);
      }

      videos.push({ id: Date.now().toString(), title, url, scene });
      scenes.add(scene);
      save();
      render();
      updateScenes();

      document.getElementById('videoTitle').value = '';
      document.getElementById('videoUrl').value = '';
      document.getElementById('videoScene').value = '';
    }

    function updateScenes() {
      const select = document.getElementById('sceneFilter');
      const current = select.value;
      select.innerHTML = Array.from(scenes).sort().map(s => 
        `<option value="${s}" ${s === current ? 'selected' : ''}>${s === 'all' ? 'すべて' : s}</option>`
      ).join('');
    }

    function savePreset() {
      const name = document.getElementById('presetName').value.trim();
      if (!name) return alert('名前入力');
      presets[name] = [...queue];
      save();
      renderPresets();
      document.getElementById('presetName').value = '';
    }

    function loadPreset(name) {
      queue = [...(presets[name] || [])];
      save();
      renderQueue();
      render();
    }

    function delPreset(name) {
      if (!confirm('削除？')) return;
      delete presets[name];
      save();
      renderPresets();
    }

    document.getElementById('searchInput').addEventListener('input', render);
    document.getElementById('sceneFilter').addEventListener('change', render);
    document.getElementById('addVideoBtn').addEventListener('click', addVideo);
    document.getElementById('playQueueBtn').addEventListener('click', () => {
      if (queue.length > 0) play(queue[0]);
    });
    document.getElementById('clearQueueBtn').addEventListener('click', () => {
      if (confirm('クリア？')) {
        queue = [];
        save();
        renderQueue();
        render();
      }
    });
    document.getElementById('savePresetBtn').addEventListener('click', savePreset);

    document.getElementById('saveR2Btn').addEventListener('click', () => {
      r2BaseUrl = document.getElementById('r2BaseUrl').value.trim();
      localStorage.setItem(R2_KEY, r2BaseUrl);
      alert('保存しました');
    });

    // エクスポート
    document.getElementById('exportBtn').addEventListener('click', () => {
      const data = { videos, queue, presets };
      const json = JSON.stringify(data, null, 2);
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `video-library-backup-${new Date().toISOString().split('T')[0]}.json`;
      a.click();
      URL.revokeObjectURL(url);
    });

    // インポート
    document.getElementById('importBtn').addEventListener('click', () => {
      document.getElementById('importFile').click();
    });

    document.getElementById('importFile').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const data = JSON.parse(event.target.result);
          videos = data.videos || [];
          queue = data.queue || [];
          presets = data.presets || {};
          videos.forEach(v => scenes.add(v.scene));
          save();
          render();
          renderQueue();
          renderPresets();
          updateScenes();
          alert('インポート完了');
        } catch (e) {
          alert('ファイルが無効です');
        }
      };
      reader.readAsText(file);
    });

    window.addEventListener('storage', e => {
      if (e.key === STORAGE_KEY) {
        load();
        render();
        renderQueue();
        renderPresets();
      }
    });

    load();
    render();
    renderQueue();
    renderPresets();
    updateScenes();
  </script>
</body>
</html>
