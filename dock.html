<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Library</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a0f2e 100%);
      color: #fff;
      font-size: 12px;
      height: 100vh;
      overflow: hidden;
    }
    .container { display: flex; flex-direction: column; height: 100vh; }
    .header {
      background: linear-gradient(135deg, #1a0f2e 0%, #2d1b4e 100%);
      padding: 16px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .header h1 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #4fc3f7, #29b6f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .search-bar { display: flex; gap: 8px; }
    .search-bar input, .search-bar select {
      flex: 1;
      padding: 8px 12px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      color: #fff;
      font-size: 12px;
      border-radius: 6px;
    }
    .search-bar input::placeholder { color: rgba(255,255,255,0.4); }
    .content { display: flex; flex: 1; min-height: 0; }
    .video-grid {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .video-card {
      background: linear-gradient(135deg, rgba(45, 27, 78, 0.6), rgba(79, 195, 247, 0.1));
      padding: 8px 10px;
      border: 1px solid rgba(79, 195, 247, 0.2);
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .video-card:hover { border-color: #4fc3f7; }
    .video-thumb {
      width: 60px; height: 34px;
      background: #000;
      border-radius: 4px;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
    }
    .video-info { flex: 1; min-width: 0; }
    .video-title {
      font-weight: 600; font-size: 12px; margin-bottom: 2px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .video-meta { font-size: 9px; color: rgba(255,255,255,0.5); }
    .video-btns { display: flex; gap: 4px; flex-shrink: 0; }
    .video-btns button {
      padding: 5px 8px; font-size: 10px; border: none; border-radius: 4px;
      cursor: pointer; background: rgba(79, 195, 247, 0.2); color: #fff;
      white-space: nowrap;
    }
    .video-btns button:hover { background: rgba(79, 195, 247, 0.4); }
    .video-btns button.delete:hover { background: rgba(244, 67, 54, 0.4); }
    .right-panel {
      width: 300px;
      background: linear-gradient(135deg, rgba(10, 10, 10, 0.6), rgba(45, 27, 78, 0.3));
      border-left: 1px solid rgba(79, 195, 247, 0.1);
      display: flex; flex-direction: column; overflow-y: auto;
    }
    .panel-section { border-bottom: 1px solid rgba(79, 195, 247, 0.1); padding: 14px; }
    .panel-title {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      background: linear-gradient(135deg, #4fc3f7, #29b6f6);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; margin-bottom: 10px; letter-spacing: 1px;
    }
    .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
    .form-group input {
      padding: 8px 10px; background: rgba(255,255,255,0.06);
      border: 1px solid rgba(79, 195, 247, 0.2); color: #fff;
      font-size: 11px; border-radius: 5px;
    }
    .form-group input::placeholder { color: rgba(255,255,255,0.3); }
    .btn {
      padding: 8px 12px;
      background: linear-gradient(135deg, #4fc3f7, #29b6f6);
      color: white; border: none; cursor: pointer;
      font-size: 11px; border-radius: 5px; font-weight: 600;
    }
    .btn:hover { opacity: 0.9; }
    .btn.full { width: 100%; }
    .btn-danger { background: linear-gradient(135deg, #f44336, #e91e63); }
    .preset-btn {
      width: 100%; padding: 6px; margin-bottom: 4px; text-align: left;
      font-size: 10px; background: rgba(79, 195, 247, 0.1); color: #fff;
      border: 1px solid rgba(79, 195, 247, 0.2); border-radius: 4px; cursor: pointer;
    }
    .empty { text-align: center; padding: 30px 20px; color: rgba(255,255,255,0.3); }
    .test-msg {
      padding: 8px;
      background: rgba(76, 175, 80, 0.2);
      border: 1px solid #4caf50;
      border-radius: 4px;
      font-size: 10px;
      margin-bottom: 8px;
      display: none;
    }
    .test-msg.show { display: block; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🎬 Video Library</h1>
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="検索...">
        <select id="sceneFilter"><option value="all">すべて</option></select>
      </div>
    </div>
    
    <div class="content">
      <div class="video-grid" id="videoGrid">
        <div class="empty">動画を追加してください</div>
      </div>
      
      <div class="right-panel">
        <div class="panel-section">
          <div class="panel-title">➕ 動画追加</div>
          <div class="form-group"><input type="text" id="videoTitle" placeholder="タイトル"></div>
          <div class="form-group"><input type="text" id="videoUrl" placeholder="動画URL (https://...)"></div>
          <div class="form-group"><input type="text" id="videoScene" placeholder="シーン名"></div>
          <button class="btn full" id="addVideoBtn">追加</button>
        </div>

        <div class="panel-section">
          <div class="panel-title">⭐ プリセット</div>
          <div class="form-group" style="margin-bottom: 8px;">
            <input type="text" id="presetName" placeholder="プリセット名">
            <button class="btn full" id="savePresetBtn">保存</button>
          </div>
          <div id="presetList"><div style="color: rgba(255,255,255,0.3); font-size: 10px;">なし</div></div>
        </div>

        <div class="panel-section">
          <div class="panel-title">💾 データ管理</div>
          <button class="btn full" id="exportBtn" style="margin-bottom: 6px;">⬇️ エクスポート</button>
          <button class="btn full" id="importBtn" style="background: linear-gradient(135deg, #9c27b0, #673ab7);">⬆️ インポート</button>
          <input type="file" id="importFile" accept=".json" style="display: none;">
        </div>

        <div class="panel-section">
          <div class="panel-title">🔧 テスト</div>
          <div class="test-msg" id="testMsg"></div>
          <button class="btn full" id="testBtn" style="background: linear-gradient(135deg, #ff9800, #f57c00);">再生テスト実行</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let videos = [];
    let presets = {};
    let scenes = new Set(['all']);
    const STORAGE_KEY = 'videoLib';
    const PLAY_KEY = 'videoLib_play';

    let channel = null;
    try {
      channel = new BroadcastChannel('video_library_channel');
    } catch (e) {
      console.warn('BroadcastChannel not supported');
    }

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ videos, presets }));
    }

    function load() {
      const data = localStorage.getItem(STORAGE_KEY);
      if (data) {
        try {
          const parsed = JSON.parse(data);
          videos = parsed.videos || [];
          presets = parsed.presets || {};
          videos.forEach(v => scenes.add(v.scene));
        } catch (e) {
          console.error('Load error:', e);
        }
      }
    }

    function render() {
      const filter = document.getElementById('sceneFilter').value;
      const search = document.getElementById('searchInput').value.toLowerCase();
      let filtered = videos;
      if (filter !== 'all') filtered = filtered.filter(v => v.scene === filter);
      if (search) filtered = filtered.filter(v => v.title.toLowerCase().includes(search));

      const grid = document.getElementById('videoGrid');
      if (filtered.length === 0) {
        grid.innerHTML = '<div class="empty">動画なし</div>';
        return;
      }

      grid.innerHTML = '';
      filtered.forEach(v => {
        const card = document.createElement('div');
        card.className = 'video-card';
        card.innerHTML = `
          <div class="video-thumb">🎬</div>
          <div class="video-info">
            <div class="video-title">${escapeHtml(v.title)}</div>
            <div class="video-meta">${escapeHtml(v.scene)}</div>
          </div>
          <div class="video-btns">
            <button class="play-btn">▶ 再生</button>
            <button class="delete">✕</button>
          </div>
        `;
        card.querySelector('.play-btn').addEventListener('click', () => playVideo(v.id));
        card.querySelector('.delete').addEventListener('click', () => deleteVideo(v.id));
        grid.appendChild(card);
      });
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function renderPresets() {
      const list = document.getElementById('presetList');
      const names = Object.keys(presets);
      if (names.length === 0) {
        list.innerHTML = '<div style="color: rgba(255,255,255,0.3); font-size: 10px;">なし</div>';
        return;
      }
      list.innerHTML = '';
      names.forEach(name => {
        const row = document.createElement('div');
        row.style.cssText = 'display: flex; gap: 4px; margin-bottom: 4px;';
        row.innerHTML = `
          <button class="preset-btn" style="flex: 1;">${escapeHtml(name)}</button>
          <button class="preset-btn btn-danger" style="width: 30px; padding: 6px 4px;">✕</button>
        `;
        row.querySelectorAll('button')[0].addEventListener('click', () => loadPreset(name));
        row.querySelectorAll('button')[1].addEventListener('click', () => deletePreset(name));
        list.appendChild(row);
      });
    }

    function playVideo(id) {
      const v = videos.find(x => x.id === id);
      if (!v) {
        console.error('Video not found:', id);
        return;
      }
      const payload = { id: v.id, url: v.url, title: v.title, timestamp: Date.now() };
      
      localStorage.setItem(PLAY_KEY, JSON.stringify(payload));
      
      window.dispatchEvent(new StorageEvent('storage', {
        key: PLAY_KEY,
        newValue: JSON.stringify(payload)
      }));
      
      if (channel) {
        channel.postMessage(payload);
      }

      showTestMessage(`再生コマンド送信: ${v.title}`);
    }

    function showTestMessage(msg) {
      const el = document.getElementById('testMsg');
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 4000);
    }

    function deleteVideo(id) {
      if (!confirm('削除しますか？')) return;
      videos = videos.filter(x => x.id !== id);
      save();
      render();
    }

    function convertGoogleDriveUrl(url) {
      const match = url.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/);
      if (match && match[1]) {
        return `https://drive.google.com/uc?export=download&id=${match[1]}`;
      }
      return url;
    }

    function addVideo() {
      const title = document.getElementById('videoTitle').value.trim();
      let url = document.getElementById('videoUrl').value.trim();
      const scene = document.getElementById('videoScene').value.trim() || 'その他';

      if (!title || !url) {
        alert('タイトルとURLを入力してください');
        return;
      }

      url = convertGoogleDriveUrl(url);

      videos.push({ id: Date.now().toString(), title, url, scene });
      scenes.add(scene);
      save();
      render();
      updateScenes();

      document.getElementById('videoTitle').value = '';
      document.getElementById('videoUrl').value = '';
      document.getElementById('videoScene').value = '';
    }

    function updateScenes() {
      const select = document.getElementById('sceneFilter');
      const current = select.value;
      select.innerHTML = Array.from(scenes).sort().map(s => 
        `<option value="${s}" ${s === current ? 'selected' : ''}>${s === 'all' ? 'すべて' : s}</option>`
      ).join('');
    }

    function savePreset() {
      const name = document.getElementById('presetName').value.trim();
      if (!name) return alert('名前入力');
      presets[name] = videos.map(v => v.id);
      save();
      renderPresets();
      document.getElementById('presetName').value = '';
    }

    function loadPreset(name) {
      showTestMessage(`プリセット読込: ${name}`);
    }

    function deletePreset(name) {
      if (!confirm('削除？')) return;
      delete presets[name];
      save();
      renderPresets();
    }

    document.getElementById('searchInput').addEventListener('input', render);
    document.getElementById('sceneFilter').addEventListener('change', render);
    document.getElementById('addVideoBtn').addEventListener('click', addVideo);
    document.getElementById('savePresetBtn').addEventListener('click', savePreset);

    document.getElementById('exportBtn').addEventListener('click', () => {
      const data = { videos, presets };
      const json = JSON.stringify(data, null, 2);
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `video-library-backup-${new Date().toISOString().split('T')[0]}.json`;
      a.click();
      URL.revokeObjectURL(url);
    });

    document.getElementById('importBtn').addEventListener('click', () => {
      document.getElementById('importFile').click();
    });

    document.getElementById('importFile').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const data = JSON.parse(event.target.result);
          videos = data.videos || [];
          presets = data.presets || {};
          videos.forEach(v => scenes.add(v.scene));
          save();
          render();
          renderPresets();
          updateScenes();
          alert('インポート完了');
        } catch (e) {
          alert('ファイルが無効です');
        }
      };
      reader.readAsText(file);
    });

    document.getElementById('testBtn').addEventListener('click', () => {
      const payload = { id: 'test', url: 'TEST_URL', title: 'テスト動画', timestamp: Date.now() };
      localStorage.setItem(PLAY_KEY, JSON.stringify(payload));
      window.dispatchEvent(new StorageEvent('storage', { key: PLAY_KEY, newValue: JSON.stringify(payload) }));
      if (channel) channel.postMessage(payload);
      showTestMessage('テスト信号送信完了。オーバーレイ側で確認してください。');
    });

    window.addEventListener('storage', e => {
      if (e.key === STORAGE_KEY) {
        load();
        render();
        renderPresets();
      }
    });

    load();
    render();
    renderPresets();
    updateScenes();
  </script>
</body>
</html>
