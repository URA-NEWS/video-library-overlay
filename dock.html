<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Library</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a0f2e 100%);
      color: #fff;
      font-size: 12px;
      height: 100vh;
      overflow: hidden;
    }
    .container { display: flex; flex-direction: column; height: 100vh; }
    .header {
      background: linear-gradient(135deg, #1a0f2e 0%, #2d1b4e 100%);
      padding: 16px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .header h1 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #4fc3f7, #29b6f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .search-bar { display: flex; gap: 8px; }
    .search-bar input, .search-bar select {
      flex: 1;
      padding: 8px 12px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      color: #fff;
      font-size: 12px;
      border-radius: 6px;
    }
    .search-bar input::placeholder { color: rgba(255,255,255,0.4); }
    .content { display: flex; flex: 1; min-height: 0; }
    .video-grid {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .video-card {
      background: linear-gradient(135deg, rgba(45, 27, 78, 0.6), rgba(79, 195, 247, 0.1));
      padding: 8px 10px;
      border: 1px solid rgba(79, 195, 247, 0.2);
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .video-card:hover { border-color: #4fc3f7; }
    .video-thumb {
      width: 60px; height: 34px;
      background: #000;
      border-radius: 4px;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
    }
    .video-info { flex: 1; min-width: 0; }
    .video-title {
      font-weight: 600; font-size: 12px; margin-bottom: 2px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .video-meta { font-size: 9px; color: rgba(255,255,255,0.5); }
    .video-btns { display: flex; gap: 4px; flex-shrink: 0; }
    .video-btns button {
      padding: 5px 8px; font-size: 10px; border: none; border-radius: 4px;
      cursor: pointer; background: rgba(79, 195, 247, 0.2); color: #fff;
      white-space: nowrap;
    }
    .video-btns button:hover { background: rgba(79, 195, 247, 0.4); }
    .right-panel {
      width: 300px;
      background: linear-gradient(135deg, rgba(10, 10, 10, 0.6), rgba(45, 27, 78, 0.3));
      border-left: 1px solid rgba(79, 195, 247, 0.1);
      display: flex; flex-direction: column; overflow-y: auto;
    }
    .panel-section { border-bottom: 1px solid rgba(79, 195, 247, 0.1); padding: 14px; }
    .panel-title {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      background: linear-gradient(135deg, #4fc3f7, #29b6f6);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; margin-bottom: 10px; letter-spacing: 1px;
    }
    .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
    .form-group input {
      padding: 8px 10px; background: rgba(255,255,255,0.06);
      border: 1px solid rgba(79, 195, 247, 0.2); color: #fff;
      font-size: 11px; border-radius: 5px;
    }
    .form-group input::placeholder { color: rgba(255,255,255,0.3); }
    .btn {
      padding: 8px 12px;
      background: linear-gradient(135deg, #4fc3f7, #29b6f6);
      color: white; border: none; cursor: pointer;
      font-size: 11px; border-radius: 5px; font-weight: 600;
    }
    .btn:hover { opacity: 0.9; }
    .btn.full { width: 100%; }
    .btn-danger { background: linear-gradient(135deg, #f44336, #e91e63); }
    .empty { text-align: center; padding: 30px 20px; color: rgba(255,255,255,0.3); }
    .status-msg {
      padding: 8px;
      background: rgba(79, 195, 247, 0.15);
      border: 1px solid #4fc3f7;
      border-radius: 4px;
      font-size: 10px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🎬 Video Library</h1>
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="検索...">
      </div>
    </div>
    
    <div class="content">
      <div class="video-grid" id="videoGrid">
        <div class="empty">読み込み中...</div>
      </div>
      
      <div class="right-panel">
        <div class="panel-section">
          <div class="panel-title">📦 GitHub連携</div>
          <div class="status-msg" id="statusMsg">
            GitHubリポジトリの「videos」フォルダに動画をアップロードすると、自動的にここに表示されます。
          </div>
          <button class="btn full" id="refreshBtn">🔄 再読み込み</button>
        </div>

        <div class="panel-section">
          <div class="panel-title">🎮 再生コントロール</div>
          <div style="display: flex; gap: 4px;">
            <button class="btn" id="pauseBtn" style="flex: 1;">⏸ 一時停止</button>
            <button class="btn" id="resumeBtn" style="flex: 1;">▶ 再開</button>
            <button class="btn btn-danger" id="stopBtn" style="flex: 1;">⏹ 停止</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const GITHUB_USER = 'URA-NEWS';
    const GITHUB_REPO = 'video-library-overlay';
    const GITHUB_BRANCH = 'main';
    const VIDEOS_FOLDER = 'videos';

    let videos = [];
    const PLAY_KEY = 'videoLib_play';
    const CONTROL_KEY = 'videoLib_control';

    let channel = null;
    try {
      channel = new BroadcastChannel('video_library_channel');
    } catch (e) {
      console.warn('BroadcastChannel not supported');
    }

    async function fetchVideoList() {
      const statusMsg = document.getElementById('statusMsg');
      statusMsg.textContent = '読み込み中...';

      try {
        const apiUrl = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${VIDEOS_FOLDER}?ref=${GITHUB_BRANCH}`;
        const res = await fetch(apiUrl);

        if (res.status === 404) {
          statusMsg.textContent = `「${VIDEOS_FOLDER}」フォルダがまだありません。GitHubで作成してください。`;
          videos = [];
          render();
          return;
        }

        if (!res.ok) {
          statusMsg.textContent = `読み込みエラー: ${res.status}`;
          return;
        }

        const data = await res.json();
        const videoExtensions = ['.mp4', '.webm', '.mov', '.m4v'];

        videos = data
          .filter(item => item.type === 'file' && videoExtensions.some(ext => item.name.toLowerCase().endsWith(ext)))
          .map(item => ({
            id: item.sha,
            title: item.name.replace(/\.[^.]+$/, ''),
            url: item.download_url,
            size: item.size
          }));

        statusMsg.textContent = `${videos.length}本の動画を検出しました`;
        render();
      } catch (e) {
        statusMsg.textContent = '読み込み失敗: ' + e.message;
        console.error(e);
      }
    }

    function formatSize(bytes) {
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + ' KB';
      return (bytes / 1024 / 1024).toFixed(1) + ' MB';
    }

    function render() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      let filtered = videos;
      if (search) filtered = filtered.filter(v => v.title.toLowerCase().includes(search));

      const grid = document.getElementById('videoGrid');
      if (filtered.length === 0) {
        grid.innerHTML = '<div class="empty">動画なし<br>GitHubの videos フォルダにアップロードしてください</div>';
        return;
      }

      grid.innerHTML = '';
      filtered.forEach(v => {
        const card = document.createElement('div');
        card.className = 'video-card';
        card.innerHTML = `
          <div class="video-thumb">🎬</div>
          <div class="video-info">
            <div class="video-title">${escapeHtml(v.title)}</div>
            <div class="video-meta">${formatSize(v.size)}</div>
          </div>
          <div class="video-btns">
            <button class="play-btn">▶ 再生</button>
          </div>
        `;
        card.querySelector('.play-btn').addEventListener('click', () => playVideo(v.id));
        grid.appendChild(card);
      });
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function playVideo(id) {
      const v = videos.find(x => x.id === id);
      if (!v) return;
      const payload = { id: v.id, url: v.url, title: v.title, timestamp: Date.now() };
      localStorage.setItem(PLAY_KEY, JSON.stringify(payload));
      window.dispatchEvent(new StorageEvent('storage', { key: PLAY_KEY, newValue: JSON.stringify(payload) }));
      if (channel) channel.postMessage(payload);
    }

    function sendControl(action) {
      const payload = { action, timestamp: Date.now() };
      localStorage.setItem(CONTROL_KEY, JSON.stringify(payload));
      window.dispatchEvent(new StorageEvent('storage', { key: CONTROL_KEY, newValue: JSON.stringify(payload) }));
      if (channel) channel.postMessage({ type: 'control', action });
    }

    document.getElementById('searchInput').addEventListener('input', render);
    document.getElementById('refreshBtn').addEventListener('click', fetchVideoList);
    document.getElementById('pauseBtn').addEventListener('click', () => sendControl('pause'));
    document.getElementById('resumeBtn').addEventListener('click', () => sendControl('resume'));
    document.getElementById('stopBtn').addEventListener('click', () => sendControl('stop'));

    fetchVideoList();
    setInterval(fetchVideoList, 30000);
  </script>
</body>
</html>
