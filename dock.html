<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Library</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #fff;
      font-size: 13px;
      height: 100vh;
      overflow: hidden;
    }
    
    .container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      gap: 0;
    }
    
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      flex-shrink: 0;
    }
    
    .header h1 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    
    .controls {
      display: flex;
      gap: 6px;
    }
    
    .controls input, .controls select {
      flex: 1;
      padding: 6px 10px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      font-size: 12px;
      border-radius: 4px;
    }
    
    .controls input::placeholder {
      color: rgba(255,255,255,0.5);
    }
    
    button {
      padding: 6px 12px;
      background: #667eea;
      color: white;
      border: none;
      cursor: pointer;
      font-size: 12px;
      border-radius: 4px;
      font-weight: 500;
      transition: all 0.2s;
    }
    
    button:hover {
      background: #764ba2;
      transform: translateY(-1px);
    }
    
    button.danger {
      background: #d32f2f;
    }
    
    button.danger:hover {
      background: #b71c1c;
    }
    
    button.success {
      background: #2e7d32;
    }
    
    button.success:hover {
      background: #1b5e20;
    }
    
    .status {
      background: rgba(102, 126, 234, 0.1);
      padding: 8px 16px;
      border-bottom: 1px solid rgba(102, 126, 234, 0.3);
      font-size: 12px;
      flex-shrink: 0;
    }
    
    .status-text {
      color: #4fc3f7;
    }
    
    .content {
      display: flex;
      flex: 1;
      gap: 0;
      min-height: 0;
    }
    
    .video-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      background: #1a1a1a;
    }
    
    .video-item {
      background: #2d2d2d;
      padding: 10px;
      margin-bottom: 6px;
      border: 1px solid #444;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .video-item:hover {
      background: #353535;
      border-color: #667eea;
      box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
    }
    
    .video-item.queued {
      border-left: 3px solid #667eea;
      background: #1f1f3a;
    }
    
    .video-title {
      font-weight: 600;
      margin-bottom: 4px;
      color: #fff;
      font-size: 13px;
    }
    
    .video-meta {
      font-size: 11px;
      color: #999;
      margin-bottom: 6px;
    }
    
    .video-actions {
      display: flex;
      gap: 4px;
    }
    
    .video-actions button {
      flex: 1;
      padding: 4px 8px;
      font-size: 11px;
    }
    
    .sidebar {
      width: 320px;
      background: #1a1a1a;
      border-left: 1px solid #333;
      display: flex;
      flex-direction: column;
      gap: 0;
      overflow: hidden;
    }
    
    .section {
      border-bottom: 1px solid #333;
      display: flex;
      flex-direction: column;
    }
    
    .section-title {
      background: #2d2d2d;
      padding: 10px 12px;
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #999;
      border-bottom: 1px solid #333;
    }
    
    .section-content {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    
    .queue-item {
      background: #2d2d2d;
      padding: 8px 10px;
      border-left: 2px solid #667eea;
      border-radius: 3px;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .queue-item span {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    
    .queue-item button {
      padding: 3px 6px;
      font-size: 10px;
      margin-left: 4px;
    }
    
    .preset-item {
      background: #2d2d2d;
      padding: 6px 10px;
      border-radius: 3px;
      font-size: 11px;
      display: flex;
      gap: 4px;
      align-items: center;
    }
    
    .preset-item button {
      padding: 3px 6px;
      font-size: 10px;
    }
    
    .add-preset {
      display: flex;
      gap: 4px;
    }
    
    .add-preset input {
      flex: 1;
      padding: 6px;
      background: #2d2d2d;
      border: 1px solid #444;
      color: #fff;
      font-size: 11px;
      border-radius: 3px;
    }
    
    .add-preset button {
      padding: 6px 10px;
      font-size: 11px;
    }
    
    .add-video {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    
    .add-video input {
      padding: 8px;
      background: #2d2d2d;
      border: 1px solid #444;
      color: #fff;
      font-size: 12px;
      border-radius: 4px;
    }
    
    .add-video button {
      padding: 8px;
      width: 100%;
    }
    
    .queue-controls {
      display: flex;
      gap: 4px;
    }
    
    .queue-controls button {
      flex: 1;
      padding: 8px;
      font-size: 11px;
    }
    
    .file-upload-section {
      border: 2px dashed #667eea;
      border-radius: 4px;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 8px;
    }
    
    .file-upload-section:hover {
      background: rgba(102, 126, 234, 0.1);
      border-color: #764ba2;
    }
    
    .file-upload-section input {
      display: none;
    }
    
    .file-upload-text {
      font-size: 11px;
      color: #999;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      color: #666;
      text-align: center;
    }

    .empty-state-icon {
      font-size: 32px;
      margin-bottom: 12px;
      opacity: 0.5;
    }

    .empty-state-text {
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🎬 Video Library</h1>
      <div class="controls">
        <input type="text" id="searchInput" placeholder="検索...">
        <select id="sceneFilter">
          <option value="all">すべてのシーン</option>
        </select>
      </div>
    </div>
    
    <div class="status">
      <span class="status-text" id="statusText">待機中...</span>
    </div>
    
    <div class="content">
      <div class="video-list" id="videoList">
        <div class="empty-state">
          <div class="empty-state-icon">📹</div>
          <div class="empty-state-text">動画を追加してください</div>
        </div>
      </div>
      
      <div class="sidebar">
        <div class="section">
          <div class="section-title">📋 キュー</div>
          <div class="section-content">
            <div id="queueList" style="flex: 1; overflow-y: auto;">
              <div style="color: #666; font-size: 12px;">キューが空です</div>
            </div>
            <div class="queue-controls">
              <button class="success" id="playQueueBtn" style="flex: 1;">▶ 再生</button>
              <button class="danger" id="clearQueueBtn" style="flex: 1;">クリア</button>
            </div>
          </div>
        </div>
        
        <div class="section">
          <div class="section-title">⭐ プリセット</div>
          <div class="section-content">
            <div class="add-preset">
              <input type="text" id="presetName" placeholder="プリセット名">
              <button id="savePresetBtn">保存</button>
            </div>
            <div id="presetList" style="flex: 1; overflow-y: auto;">
              <div style="color: #666; font-size: 12px;">プリセットなし</div>
            </div>
          </div>
        </div>
        
        <div class="section">
          <div class="section-title">➕ 動画追加</div>
          <div class="section-content" style="flex: 0;">
            <div class="file-upload-section" id="fileUploadArea">
              <input type="file" id="videoFile" accept="video/*">
              <div class="file-upload-text">📁 ファイルをドラッグ or クリック</div>
            </div>
            <div class="add-video">
              <input type="text" id="videoTitle" placeholder="タイトル">
              <input type="text" id="videoUrl" placeholder="URL (https://... または ローカルファイル)">
              <input type="text" id="videoScene" placeholder="シーン">
              <input type="text" id="videoMaterials" placeholder="素材">
              <button id="addVideoBtn">追加</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let allVideos = [];
    let queue = [];
    let presets = {};
    let scenes = new Set(['all']);
    let uploadedFiles = {};
    const STORAGE_KEY = 'videoLibrary';

    // ストレージ操作
    function saveToStorage() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        videos: allVideos,
        queue,
        presets
      }));
      window.dispatchEvent(new StorageEvent('storage', {
        key: STORAGE_KEY,
        newValue: JSON.stringify({ videos: allVideos, queue, presets })
      }));
    }

    function loadFromStorage() {
      const data = localStorage.getItem(STORAGE_KEY);
      if (data) {
        const parsed = JSON.parse(data);
        allVideos = parsed.videos || [];
        queue = parsed.queue || [];
        presets = parsed.presets || {};
      }
    }

    function init() {
      loadFromStorage();
      renderVideos();
      renderQueue();
      renderPresets();
      updateSceneFilter();
      setupEventListeners();
    }

    function renderVideos(scene = 'all', search = '') {
      const container = document.getElementById('videoList');
      let filtered = allVideos;

      if (scene && scene !== 'all') {
        filtered = filtered.filter(v => v.scene === scene);
      }
      if (search) {
        const searchLower = search.toLowerCase();
        filtered = filtered.filter(v => 
          v.title.toLowerCase().includes(searchLower) || 
          (v.materials && v.materials.toLowerCase().includes(searchLower))
        );
      }

      if (filtered.length === 0) {
        container.innerHTML = `<div class="empty-state"><div class="empty-state-icon">🎞️</div><div class="empty-state-text">該当する動画なし</div></div>`;
        return;
      }

      container.innerHTML = filtered.map(video => `
        <div class="video-item ${queue.includes(video.id) ? 'queued' : ''}">
          <div class="video-title">${video.title}</div>
          <div class="video-meta">
            <span>シーン: ${video.scene}</span> • <span>素材: ${video.materials || 'N/A'}</span>
          </div>
          <div class="video-actions">
            <button style="background: #667eea;" onclick="playVideo('${video.id}')">▶ 再生</button>
            <button style="background: #764ba2;" onclick="addToQueue('${video.id}')">＋ 追加</button>
            <button class="danger" style="padding: 4px;" onclick="deleteVideo('${video.id}')">✕</button>
          </div>
        </div>
      `).join('');

      allVideos.forEach(v => scenes.add(v.scene));
    }

    function playVideo(videoId) {
      const video = allVideos.find(v => v.id === videoId);
      if (video) {
        const playing = { id: videoId, title: video.title, url: video.url, timestamp: Date.now() };
        localStorage.setItem('videoLibrary_playing', JSON.stringify(playing));
        window.dispatchEvent(new StorageEvent('storage', {
          key: 'videoLibrary_playing',
          newValue: JSON.stringify(playing)
        }));
        updateStatus(`▶ 再生: ${video.title}`);
      }
    }

    function addToQueue(videoId) {
      if (!queue.includes(videoId)) {
        queue.push(videoId);
        saveToStorage();
        renderVideos(document.getElementById('sceneFilter').value, document.getElementById('searchInput').value);
        renderQueue();
        updateStatus('➕ キューに追加');
      }
    }

    function removeFromQueue(videoId) {
      queue = queue.filter(id => id !== videoId);
      saveToStorage();
      renderVideos(document.getElementById('sceneFilter').value, document.getElementById('searchInput').value);
      renderQueue();
    }

    function renderQueue() {
      const container = document.getElementById('queueList');
      if (queue.length === 0) {
        container.innerHTML = '<div style="color: #666; font-size: 12px;">キューが空です</div>';
        return;
      }

      container.innerHTML = queue.map((videoId, index) => {
        const video = allVideos.find(v => v.id === videoId);
        return `
          <div class="queue-item">
            <span title="${video?.title || '?'}">${index + 1}. ${video?.title || '?'}</span>
            <button class="danger" onclick="removeFromQueue('${videoId}')">✕</button>
          </div>
        `;
      }).join('');
    }

    function renderPresets() {
      const container = document.getElementById('presetList');
      const names = Object.keys(presets);
      if (names.length === 0) {
        container.innerHTML = '<div style="color: #666; font-size: 12px;">プリセットなし</div>';
        return;
      }

      container.innerHTML = names.map(name => `
        <div class="preset-item">
          <button style="flex: 1; text-align: left;" onclick="loadPreset('${name}')">${name}</button>
          <button class="danger" onclick="deletePreset('${name}')">✕</button>
        </div>
      `).join('');
    }

    function savePreset() {
      const name = document.getElementById('presetName').value.trim();
      if (!name) {
        alert('プリセット名を入力してください');
        return;
      }
      presets[name] = [...queue];
      saveToStorage();
      renderPresets();
      document.getElementById('presetName').value = '';
      updateStatus(`⭐ プリセット保存: ${name}`);
    }

    function loadPreset(name) {
      if (presets[name]) {
        queue = [...presets[name]];
        saveToStorage();
        renderQueue();
        renderVideos(document.getElementById('sceneFilter').value, document.getElementById('searchInput').value);
        updateStatus(`⭐ プリセット読み込み: ${name}`);
      }
    }

    function deletePreset(name) {
      if (confirm(`プリセット "${name}" を削除しますか？`)) {
        delete presets[name];
        saveToStorage();
        renderPresets();
      }
    }

    function deleteVideo(videoId) {
      if (confirm('この動画を削除しますか？')) {
        allVideos = allVideos.filter(v => v.id !== videoId);
        queue = queue.filter(id => id !== videoId);
        saveToStorage();
        renderVideos(document.getElementById('sceneFilter').value, document.getElementById('searchInput').value);
        renderQueue();
      }
    }

    function addVideo() {
      const title = document.getElementById('videoTitle').value.trim();
      const url = document.getElementById('videoUrl').value.trim();
      const scene = document.getElementById('videoScene').value.trim();
      const materials = document.getElementById('videoMaterials').value.trim();

      if (!title || !url) {
        alert('タイトルと URL は必須です');
        return;
      }

      const newVideo = {
        id: Date.now().toString(),
        title,
        url,
        scene: scene || 'その他',
        materials
      };

      allVideos.push(newVideo);
      saveToStorage();
      renderVideos(document.getElementById('sceneFilter').value, document.getElementById('searchInput').value);
      updateSceneFilter();

      document.getElementById('videoTitle').value = '';
      document.getElementById('videoUrl').value = '';
      document.getElementById('videoScene').value = '';
      document.getElementById('videoMaterials').value = '';
      document.getElementById('videoFile').value = '';
      updateStatus(`✅ 動画追加: ${title}`);
    }

    function updateSceneFilter() {
      const select = document.getElementById('sceneFilter');
      const current = select.value;
      select.innerHTML = Array.from(scenes).sort().map(s => 
        `<option value="${s}" ${s === current ? 'selected' : ''}>${s === 'all' ? 'すべてのシーン' : s}</option>`
      ).join('');
    }

    function updateStatus(text) {
      document.getElementById('statusText').textContent = text;
      setTimeout(() => {
        document.getElementById('statusText').textContent = '待機中...';
      }, 3000);
    }

    function setupEventListeners() {
      document.getElementById('searchInput').addEventListener('input', (e) => {
        const scene = document.getElementById('sceneFilter').value;
        renderVideos(scene, e.target.value);
      });

      document.getElementById('sceneFilter').addEventListener('change', (e) => {
        const search = document.getElementById('searchInput').value;
        renderVideos(e.target.value, search);
      });

      document.getElementById('playQueueBtn').addEventListener('click', () => {
        if (queue.length === 0) {
          alert('キューが空です');
          return;
        }
        playVideo(queue[0]);
        updateStatus('▶ キュー再生開始');
      });

      document.getElementById('clearQueueBtn').addEventListener('click', () => {
        if (confirm('キューをクリアしますか？')) {
          queue = [];
          saveToStorage();
          renderQueue();
          renderVideos(document.getElementById('sceneFilter').value, document.getElementById('searchInput').value);
          updateStatus('🗑️ キュークリア');
        }
      });

      document.getElementById('savePresetBtn').addEventListener('click', savePreset);
      document.getElementById('addVideoBtn').addEventListener('click', addVideo);

      // ファイルアップロード
      const fileUploadArea = document.getElementById('fileUploadArea');
      const videoFile = document.getElementById('videoFile');

      fileUploadArea.addEventListener('click', () => videoFile.click());

      fileUploadArea.addEventListener('dragover', (e) => {
        e.preventDefault();
        fileUploadArea.style.background = 'rgba(102, 126, 234, 0.2)';
      });

      fileUploadArea.addEventListener('dragleave', () => {
        fileUploadArea.style.background = '';
      });

      fileUploadArea.addEventListener('drop', (e) => {
        e.preventDefault();
        fileUploadArea.style.background = '';
        const files = e.dataTransfer.files;
        if (files.length > 0) {
          handleFileUpload(files[0]);
        }
      });

      videoFile.addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
          handleFileUpload(e.target.files[0]);
        }
      });

      window.addEventListener('storage', (e) => {
        if (e.key === STORAGE_KEY) {
          loadFromStorage();
          renderVideos(document.getElementById('sceneFilter').value, document.getElementById('searchInput').value);
          renderQueue();
          renderPresets();
        }
      });
    }

    function handleFileUpload(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        const fileId = 'file_' + Date.now();
        uploadedFiles[fileId] = e.target.result;
        document.getElementById('videoTitle').value = file.name.replace(/\.[^.]+$/, '');
        document.getElementById('videoUrl').value = 'blob:' + fileId;
        updateStatus(`📁 ファイル読み込み: ${file.name}`);
      };
      reader.readAsDataURL(file);
    }

    // Blob URL サポート
    const originalPlayVideo = playVideo;
    window.playVideo = function(videoId) {
      const video = allVideos.find(v => v.id === videoId);
      if (video && video.url.startsWith('blob:')) {
        const fileId = video.url.replace('blob:', '');
        if (uploadedFiles[fileId]) {
          const playing = { id: videoId, title: video.title, url: uploadedFiles[fileId], timestamp: Date.now() };
          localStorage.setItem('videoLibrary_playing', JSON.stringify(playing));
          window.dispatchEvent(new StorageEvent('storage', {
            key: 'videoLibrary_playing',
            newValue: JSON.stringify(playing)
          }));
          updateStatus(`▶ 再生: ${video.title}`);
          return;
        }
      }
      originalPlayVideo(videoId);
    };

    init();
  </script>
</body>
</html>
