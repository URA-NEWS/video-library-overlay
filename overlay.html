<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Library Overlay</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: transparent;
      color: #fff;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    .overlay-container {
      width: 1280px;
      height: 720px;
      position: relative;
    }
    video {
      width: 100%;
      height: 100%;
      background: #000;
      border: none;
      display: none;
    }
    video.active { display: block; }
    .status-bar {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      padding: 10px 15px;
      border-radius: 5px;
      font-size: 14px;
      min-width: 200px;
      display: none;
      z-index: 10;
      font-family: -apple-system, sans-serif;
    }
    .status-title { font-weight: bold; color: #4fc3f7; margin-bottom: 4px; }
    .status-text { font-size: 12px; color: #ccc; }
  </style>
</head>
<body>
  <div class="overlay-container">
    <video id="videoPlayer" muted playsinline></video>
    <div class="status-bar" id="statusBar">
      <div class="status-title">再生中</div>
      <div class="status-text" id="statusText">タイトル</div>
    </div>
  </div>

  <script>
    const videoElement = document.getElementById('videoPlayer');
    const statusBar = document.getElementById('statusBar');
    const statusText = document.getElementById('statusText');
    
    let currentVideoId = null;
    let lastControlTimestamp = 0;
    const PLAY_KEY = 'videoLib_play';
    const CONTROL_KEY = 'videoLib_control';

    videoElement.loop = false;

    let channel = null;
    try {
      channel = new BroadcastChannel('video_library_channel');
      channel.onmessage = (event) => {
        if (event.data && event.data.type === 'control') {
          handleControl(event.data.action);
        } else {
          handlePlayData(event.data);
        }
      };
    } catch (e) {
      console.warn('BroadcastChannel not supported');
    }

    function handlePlayData(data) {
      if (!data || !data.url) return;
      if (data.id === currentVideoId) return;
      playVideo(data);
    }

    function handleControl(action) {
      if (action === 'pause') {
        videoElement.pause();
      } else if (action === 'resume') {
        videoElement.play().catch(() => {});
      } else if (action === 'stop') {
        videoElement.pause();
        videoElement.currentTime = 0;
        videoElement.classList.remove('active');
        videoElement.src = '';
        statusBar.style.display = 'none';
        currentVideoId = null;
      }
    }

    function playVideo(data) {
      currentVideoId = data.id;
      videoElement.loop = false;
      videoElement.src = data.url;
      videoElement.muted = true;
      videoElement.classList.add('active');
      videoElement.play().catch(err => console.error('再生エラー:', err));

      statusBar.style.display = 'block';
      statusText.textContent = data.title;
    }

    function pollForCurrentlyPlaying() {
      try {
        const raw = localStorage.getItem(PLAY_KEY);
        if (!raw) return;
        const data = JSON.parse(raw);
        if (data && data.url && data.id !== currentVideoId) {
          handlePlayData(data);
        }
      } catch (e) {
        console.error('Poll error:', e);
      }
    }

    function pollForControl() {
      try {
        const raw = localStorage.getItem(CONTROL_KEY);
        if (!raw) return;
        const data = JSON.parse(raw);
        if (data && data.timestamp && data.timestamp !== lastControlTimestamp) {
          lastControlTimestamp = data.timestamp;
          handleControl(data.action);
        }
      } catch (e) {
        console.error('Control poll error:', e);
      }
    }

    function init() {
      pollForCurrentlyPlaying();
      setInterval(pollForCurrentlyPlaying, 500);
      setInterval(pollForControl, 300);

      videoElement.addEventListener('ended', () => {
        videoElement.classList.remove('active');
        videoElement.src = '';
        statusBar.style.display = 'none';
        currentVideoId = null;
      });

      videoElement.addEventListener('error', () => {
        console.error('動画エラー:', videoElement.error);
      });

      window.addEventListener('storage', (e) => {
        if (e.key === PLAY_KEY) {
          pollForCurrentlyPlaying();
        } else if (e.key === CONTROL_KEY) {
          pollForControl();
        }
      });
    }

    init();
  </script>
</body>
</html>
