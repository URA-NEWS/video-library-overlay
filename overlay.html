<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Library Overlay</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: transparent;
      color: #fff;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    
    .overlay-container {
      width: 1280px;
      height: 720px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    
    video {
      width: 100%;
      height: 100%;
      background: #000;
      object-fit: contain;
    }
    
    .status-bar {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 10px 15px;
      border-radius: 5px;
      font-size: 14px;
      min-width: 200px;
    }
    
    .status-title {
      font-weight: bold;
      color: #4fc3f7;
      margin-bottom: 4px;
    }
    
    .status-text {
      font-size: 12px;
      color: #ccc;
    }
  </style>
</head>
<body>
  <div class="overlay-container">
    <video id="videoPlayer" muted></video>
    <div class="status-bar" id="statusBar" style="display: none;">
      <div class="status-title" id="statusTitle">再生中</div>
      <div class="status-text" id="statusText">タイトル</div>
    </div>
  </div>

  <script>
    const videoElement = document.getElementById('videoPlayer');
    const statusBar = document.getElementById('statusBar');
    const statusTitle = document.getElementById('statusTitle');
    const statusText = document.getElementById('statusText');
    
    let currentVideoId = null;
    let pollingInterval = null;

    // 初期化
    function init() {
      pollForCurrentlyPlaying();
      // 500ms ごとに localStorage をチェック
      pollingInterval = setInterval(pollForCurrentlyPlaying, 500);
      
      // 動画終了イベント
      videoElement.addEventListener('ended', () => {
        videoElement.src = '';
        statusBar.style.display = 'none';
      });

      // 他のタブでの再生命令を反映
      window.addEventListener('storage', (e) => {
        if (e.key === 'videoLibrary_playing') {
          const data = JSON.parse(e.newValue || '{}');
          if (data.url && data.id !== currentVideoId) {
            playVideo(data);
          }
        }
      });
    }

    // 現在再生中をポーリング
    function pollForCurrentlyPlaying() {
      try {
        const data = JSON.parse(localStorage.getItem('videoLibrary_playing') || '{}');
        
        if (data && data.url && data.id !== currentVideoId) {
          playVideo(data);
        }
      } catch (e) {
        console.error('Poll failed:', e);
      }
    }

    // 動画再生
    function playVideo(data) {
      currentVideoId = data.id;
      videoElement.src = data.url;
      videoElement.muted = true;
      videoElement.play().catch(err => console.error('Play error:', err));
      
      // ステータスバー表示
      statusBar.style.display = 'block';
      statusTitle.textContent = '再生中';
      statusText.textContent = data.title;
    }

    init();
  </script>
</body>
</html>
